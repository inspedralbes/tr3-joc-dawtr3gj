behaviors:
  TankArenaEnemy:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 8
    checkpoint_interval: 250000
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 20000

env_settings:
  env_path: null
  seed: 1
  num_envs: 1

engine_settings:
  width: 1280
  height: 720
  quality_level: 1
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

checkpoint_settings:
  run_id: tank-arena-enemy
  initialize_from: null
  load_model: false
  resume: false

torch_settings:
  device: cpu

debug: false
